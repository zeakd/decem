name: A value looks wrong
description: A result you believe is incorrect
labels: ["correctness"]
body:
  - type: markdown
    attributes:
      value: |
        Filled in, this becomes a case we can drop into the oracle, which is what decides
        the question. Note that the oracle decides it, not decem and not whichever other
        library disagrees, for the reasons in `docs/differences.md`.
  - type: input
    id: operation
    attributes:
      label: Operation
      placeholder: div
    validations: { required: true }
  - type: input
    id: arguments
    attributes:
      label: Arguments, as you wrote them
      placeholder: '["1", "3"]'
    validations: { required: true }
  - type: input
    id: precision
    attributes:
      label: Precision and rounding
      placeholder: '{ digits: 20 }, half-even'
    validations: { required: true }
  - type: input
    id: got
    attributes:
      label: What you got
    validations: { required: true }
  - type: input
    id: expected
    attributes:
      label: What you expected, and where that came from
      placeholder: 0.33333333333333333333, from Python's decimal
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version and runtime
      placeholder: decem 0.1.0, Node 22
